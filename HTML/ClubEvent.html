<!-- Week 4: Club Event + Registration Page
HTML Forms, Tables & Mini Project
QUESTION
Make a Coding Club page. Show the events in a table. Then make a registration form where students can type their details.
WHAT TO DO (replaces 4.1 to 4.5)
4.1 Add a form with name, email and password. Use label for each box
4.2 Add date, phone, radio buttons, checkboxes, a dropdown (select), a message box (textarea) and a submit button
4.3 Make an events table with a heading row, body rows and a footer row
4.4 Add meta tags and a favicon in the head
4.5 Real project has 4 pages (Home, About, Register, Contact). Copy this page 4 times and link them with the same menu -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Event</title>
</head>
<body>
    <header>
        <h1>Coding Club</h1>
        <h3>Upcoming Events</h3>
    </header>
    <main>
        <table border="1">
           <caption>Club Events</caption>
           <thead>
           <th>Event</th>
           <th>Date</th>
           <th>Venue</th>
           <tr>
            <td>
                HTML Workshop
            </td>
            <td>
                12 Nov.
            </td>
            <td>
                Lab 1
            </td>
           </tr>
           
            <tr>
            <td>
                Hackathon
            </td>
            <td>
                20 Nov.
            </td>
            <td>
                Seminar Hall 
            </td>
           </tr>
           <tr>
            <td colspan="3">
                Total Events: 2
            </td>
           </tr>
           </thead>
        </table>
    </main>
    <section>
        <form action="">
            <head>
                <h2>Register</h2>
            </head>
            <label for="name">
                Name: <input type="text"> 
            </label>
            <br><br>
            <label for="email">
                Email: <input type="email">
            </label>
            <br><br>
            <label for="password">
                Password: <input type="password">
            </label>
            <br><br>
            <label for="dob">
                DOB: <input type="date">
            </label>
            <br><br>
            <label for="number">
                Mobile No. : <input type="tel">
            </label>
            <br><br>
            <label for="gender">
                Age: Male<input type="radio">
                Female<input type="radio">
            </label>
            <br><br>
            <label for="interest">
                Interests: Web<input type="radio">
                DSA <input type="radio">
            </label>
        </form>
    </section>
</body>
</html>
